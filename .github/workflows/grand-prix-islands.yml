name: Grand Prix islands
run-name: Grand Prix islands · ${{ inputs.request_id || github.run_id }}

# Timed campaigns are deliberately manual; pull requests run the independent unit CI.
on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Linux x64 runner label; runtime checks require the selected CPU profile'
        default: ubuntu-24.04
        type: string
      profile:
        description: 'Frozen allocation; hosted four-CPU results form a separate comparison cohort'
        default: gha-4-v1
        type: choice
        options:
          - gha-4-v1
          - native-8-v1
      diagnostic:
        description: 'Opt into diagnostic evidence; never reported as qualified measurements'
        default: false
        type: boolean
      request_id:
        description: 'Optional local control-room request identifier'
        default: ''
        type: string
      cars:
        description: 'Comma-separated island competitors, or all'
        default: 'forma,react-node,react-bun,react-deno,preact-node,solid-node,svelte-node,vue-node,next,react-router,astro'
        type: string

concurrency:
  group: grand-prix-islands-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  GP_RUN_ID: islands-${{ github.run_id }}-${{ github.run_attempt }}
  GP_RESULTS_DIR: ${{ github.workspace }}/runs/islands-${{ github.run_id }}-${{ github.run_attempt }}/artifacts
  GP_REQUEST_ID: ${{ inputs.request_id }}
  GP_PROFILE: ${{ inputs.profile }}
  GP_DIAGNOSTIC: ${{ inputs.diagnostic && 'true' || 'false' }}
  GP_CARS: ${{ inputs.cars }}

jobs:
  campaign:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Open retained attempt before preparation
        run: node src/ci-capture.mjs begin islands
      - name: Verify correctness and refusal controls
        run: npm test 2>&1 | tee -a "runs/$GP_RUN_ID/setup.log"
      - name: Prepare exact framework sources separately from laboratory source
        run: node src/ci-capture.mjs prepare islands 2>&1 | tee -a "runs/$GP_RUN_ID/setup.log"
      - name: Install locked browser tooling
        run: npm ci --prefix island-race --ignore-scripts --no-audit --no-fund 2>&1 | tee -a "runs/$GP_RUN_ID/setup.log"
      - name: Install and authenticate frozen Chromium
        id: browser
        run: |
          sudo --preserve-env=GITHUB_OUTPUT "$(command -v node)" harness/install-linux-browser.mjs "$RUNNER_TEMP/gp264-browser" --install-deps --install-apparmor-profile 2>&1 | tee -a "runs/$GP_RUN_ID/setup.log"
          cp "$RUNNER_TEMP/gp264-browser/browser-lock.json" "runs/$GP_RUN_ID/artifacts/browser-lock.json"
      - name: Run requested measurements sequentially
        env:
          CHROME_PATH: ${{ steps.browser.outputs.path }}
        run: node src/ci-capture.mjs run islands
      - name: Remove this run's browser profile
        if: always() && steps.browser.outputs.sandbox_profile != ''
        env:
          GP_BROWSER_PROFILE: ${{ steps.browser.outputs.sandbox_profile }}
        run: sudo "$(command -v node)" harness/browser-sandbox.mjs --remove "$GP_BROWSER_PROFILE" 2>&1 | tee -a "runs/$GP_RUN_ID/cleanup.log"
      - name: Remove only this attempt's Docker resources
        if: always()
        run: node harness/cleanup.mjs 2>&1 | tee -a "runs/$GP_RUN_ID/cleanup.log"
      - name: Compact generated outputs and seal human and machine reports
        if: always()
        env:
          GP_WORKFLOW_STATUS: ${{ job.status }}
        run: |
          node src/ci-capture.mjs finish islands
          cat "runs/$GP_RUN_ID/report.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain every attempt including failed measurements
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: grand-prix-islands-${{ github.run_id }}-${{ github.run_attempt }}
          path: runs/${{ env.GP_RUN_ID }}/
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true
