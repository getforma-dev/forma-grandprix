name: Grand Prix paired
run-name: Grand Prix paired · ${{ inputs.request_id || github.run_id }}

# Timed campaigns are deliberately manual; pull requests run the independent unit CI.
on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Linux x64 runner label; runtime checks require the selected CPU profile'
        default: ubuntu-24.04
        type: string
      profile:
        description: 'Frozen allocation; hosted four-CPU results form a separate comparison cohort'
        default: gha-4-v1
        type: choice
        options:
          - gha-4-v1
          - native-8-v1
      diagnostic:
        description: 'Opt into diagnostic evidence; never reported as qualified measurements'
        default: false
        type: boolean
      request_id:
        description: 'Optional local control-room request identifier'
        default: ''
        type: string
      forma_refs:
        description: 'One to four exact Forma source commits; published control always runs on the same VM'
        default: 'fc76ea8531f0e3a85d0224087384e41f52040e3c'
        required: true
        type: string

concurrency:
  group: grand-prix-paired-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  GP_RUN_ID: paired-${{ github.run_id }}-${{ github.run_attempt }}
  GP_RESULTS_DIR: ${{ github.workspace }}/runs/paired-${{ github.run_id }}-${{ github.run_attempt }}/artifacts
  GP_REQUEST_ID: ${{ inputs.request_id }}
  GP_PROFILE: ${{ inputs.profile }}
  GP_DIAGNOSTIC: ${{ inputs.diagnostic && 'true' || 'false' }}
  GP_FORMA_REFS: ${{ inputs.forma_refs }}

jobs:
  campaign:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Open retained attempt before preparation
        run: node src/ci-capture.mjs begin paired
      - name: Verify correctness and refusal controls
        run: npm test 2>&1 | tee -a "runs/$GP_RUN_ID/setup.log"
      - name: Prepare exact framework sources separately from laboratory source
        run: node src/ci-capture.mjs prepare paired 2>&1 | tee -a "runs/$GP_RUN_ID/setup.log"
      - name: Run requested measurements sequentially
        run: node src/ci-capture.mjs run paired
      - name: Remove only this attempt's Docker resources
        if: always()
        run: node harness/paired-server.mjs --cleanup 2>&1 | tee -a "runs/$GP_RUN_ID/cleanup.log"
      - name: Compact generated outputs and seal human and machine reports
        if: always()
        env:
          GP_WORKFLOW_STATUS: ${{ job.status }}
        run: |
          node src/ci-capture.mjs finish paired
          cat "runs/$GP_RUN_ID/report.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain every attempt including failed measurements
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: grand-prix-paired-${{ github.run_id }}-${{ github.run_attempt }}
          path: runs/${{ env.GP_RUN_ID }}/
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true
