name: Grand Prix client and signals

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Native Linux x64 runner matching the selected resource profile'
        default: 'ubuntu-latest'
        type: string
      profile:
        description: 'Frozen CPU allocation; gha-4-v1 requires the standard four-CPU GHA VM'
        type: choice
        default: native-8-v1
        options:
          - native-8-v1
          - gha-4-v1
      diagnostic:
        description: 'Allow a smaller Linux VM for diagnostics'
        default: true
        type: boolean
      forma_refs:
        description: 'Comma-separated exact source commits after the published baseline; empty uses this checkout'
        default: ''
        type: string
      profile_rows:
        description: 'Retain diagnostic source-mapped row CPU captures after all scored timings'
        default: false
        type: boolean
      compiler_templates:
        description: 'Build each candidate compiler and apply its supported client-template transform'
        default: false
        type: boolean
  pull_request:
    paths:
      - 'benchmarks/grand-prix/client-race/**'
      - 'benchmarks/grand-prix/signals-race/**'
      - 'benchmarks/grand-prix/harness/client-linux.mjs'
      - 'benchmarks/grand-prix/harness/client-signals-control*'
      - 'benchmarks/grand-prix/harness/resource-profile*'
      - 'benchmarks/grand-prix/harness/install-linux-browser.mjs'
      - 'benchmarks/grand-prix/harness/browser-sandbox*'
      - 'benchmarks/grand-prix/harness/chromium-linux-lock.json'
      - '.github/workflows/grand-prix-client.yml'

concurrency:
  group: grand-prix-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    permissions:
      contents: read
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install locked browser tooling
        working-directory: benchmarks/grand-prix/island-race
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check browser profile path restrictions
        run: node --test benchmarks/grand-prix/client-race/timing.test.mjs benchmarks/grand-prix/harness/browser-sandbox.test.mjs benchmarks/grand-prix/harness/resource-profile.test.mjs benchmarks/grand-prix/harness/campaign.test.mjs benchmarks/grand-prix/harness/client-signals-control.test.mjs
      - name: Install and verify frozen Chromium
        id: browser
        run: sudo --preserve-env=GITHUB_OUTPUT "$(command -v node)" benchmarks/grand-prix/harness/install-linux-browser.mjs "$RUNNER_TEMP/gp264-chromium" --install-deps --install-apparmor-profile
      - name: Run baseline and candidates sequentially
        working-directory: benchmarks/grand-prix
        env:
          GP_RUN_ID: client-${{ github.run_id }}-${{ github.run_attempt }}
          GP_DIAGNOSTIC: ${{ github.event_name == 'pull_request' && 'true' || inputs.diagnostic && 'true' || 'false' }}
          GP_PROFILE: ${{ inputs.profile || 'native-8-v1' }}
          GP_CLIENT_REFS: ${{ inputs.forma_refs || github.sha }}
          GP_PROFILE_ROWS: ${{ inputs.profile_rows && 'true' || 'false' }}
          GP_COMPILER_TEMPLATES: ${{ github.event_name == 'pull_request' && 'true' || inputs.compiler_templates && 'true' || 'false' }}
          CHROME_PATH: ${{ steps.browser.outputs.path }}
        run: |
          node --input-type=module <<'JS'
          import {spawnSync} from 'node:child_process';
          import {readFileSync} from 'node:fs';
          const lock=JSON.parse(readFileSync('harness/chromium-linux-lock.json'));
          const args=['harness/client-linux.mjs','--chrome',process.env.CHROME_PATH,'--chrome-sha256',lock.executableSha256,'--forma-refs',process.env.GP_CLIENT_REFS];
          if(process.env.GP_DIAGNOSTIC==='true')args.push('--diagnostic');
          if(process.env.GP_PROFILE_ROWS==='true')args.push('--profile-rows');
          if(process.env.GP_COMPILER_TEMPLATES==='true')args.push('--compiler-templates');
          const result=spawnSync(process.execPath,args,{stdio:'inherit'});
          process.exit(result.status??1);
          JS
      - name: Remove this run's browser profile
        if: always() && steps.browser.outputs.sandbox_profile != ''
        env:
          GP_BROWSER_PROFILE: ${{ steps.browser.outputs.sandbox_profile }}
        run: sudo "$(command -v node)" benchmarks/grand-prix/harness/browser-sandbox.mjs --remove "$GP_BROWSER_PROFILE"
      - name: Remove only this run's Docker resources
        if: always()
        working-directory: benchmarks/grand-prix
        env:
          GP_RUN_ID: client-${{ github.run_id }}-${{ github.run_attempt }}
        run: node harness/cleanup.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: grand-prix-client-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            benchmarks/grand-prix/results/*-client/run.json
            benchmarks/grand-prix/results/*-client/resource-profile.json
            benchmarks/grand-prix/results/*-client/*/raw/
            benchmarks/grand-prix/results/*-client/*/client-race/package-lock.json
            benchmarks/grand-prix/results/*-client/*/signals-race/package-lock.json
            benchmarks/grand-prix/results/*-client/*/compiler-templates.json
            benchmarks/grand-prix/results/*-client/*/client-race/apps/forma/dist/
            benchmarks/grand-prix/results/*-cleanup.json
            ${{ runner.temp }}/gp264-chromium/browser-lock.json
          if-no-files-found: error
          retention-days: 30
