name: Grand Prix response compression

on:
  pull_request:
    paths:
      - 'benchmarks/grand-prix/harness/compression*'
      - 'benchmarks/grand-prix/harness/candidate-lock.mjs'
      - 'benchmarks/grand-prix/harness/prepare-car.mjs'
      - '.github/workflows/grand-prix-compression.yml'
  workflow_dispatch:
    inputs:
      forma_ref:
        description: 'Exact 40-character source commit containing opt-in compression'
        required: true
        type: string
      runner:
        description: 'Linux runner label; must satisfy the selected resource protocol'
        default: 'ubuntu-latest'
        type: string
      profile:
        description: 'Resource protocol; four-CPU GHA results are separate from the native eight-CPU baseline'
        default: 'native-8-v1'
        type: choice
        options:
          - native-8-v1
          - gha-4-v1
      diagnostic:
        description: 'Allow a smaller Linux VM; results remain diagnostic'
        default: true
        type: boolean

concurrency:
  group: grand-prix-compression-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compression:
    permissions:
      contents: read
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Check codec, encoding and qualification refusals
        run: node --test benchmarks/grand-prix/harness/candidate-lock.test.mjs benchmarks/grand-prix/harness/prepare-car.test.mjs benchmarks/grand-prix/harness/transport.test.mjs benchmarks/grand-prix/harness/compression.test.mjs benchmarks/grand-prix/harness/resource-profile.test.mjs benchmarks/grand-prix/harness/campaign.test.mjs
      - name: Run identity, Brotli and gzip sequentially from one binary
        if: github.event_name == 'workflow_dispatch'
        working-directory: benchmarks/grand-prix
        env:
          GP_RUN_ID: compression-${{ github.run_id }}-${{ github.run_attempt }}
          GP_CARS: forma
          GP_BASELINE: 'true'
          GP_COMPRESSION: 'true'
          GP_PROFILE: ${{ inputs.profile || 'native-8-v1' }}
          GP_DIAGNOSTIC: ${{ inputs.diagnostic && 'true' || 'false' }}
          GP_FORMA_REF: ${{ inputs.forma_ref }}
        run: node harness/ci-run.mjs
      - name: Remove only this run's remaining Docker resources
        if: always() && github.event_name == 'workflow_dispatch'
        working-directory: benchmarks/grand-prix
        env:
          GP_RUN_ID: compression-${{ github.run_id }}-${{ github.run_attempt }}
        run: node harness/cleanup.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && github.event_name == 'workflow_dispatch'
        with:
          name: grand-prix-compression-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            benchmarks/grand-prix/results/*.json
            benchmarks/grand-prix/results/*.lock
            benchmarks/grand-prix/results/*-compression/
            benchmarks/grand-prix/results/*-runtime/
          if-no-files-found: error
          retention-days: 30
